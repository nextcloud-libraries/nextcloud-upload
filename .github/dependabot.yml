version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
    timezone: Europe/Paris
  open-pull-requests-limit: 10
  versioning-strategy: increase
  labels:
    - 3. to review
    - dependencies
  commit-message:
    prefix: "chore"
    include: "scope"
  ignore:
      - dependency-name: "*"
        # ignore all major updates
        update-types: ["version-update:semver-major"]

- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    timezone: Europe/Paris
  open-pull-requests-limit: 10
  labels:
    - 3. to review
    - dependencies
  commit-message:
    prefix: "ci"
    include: "scope"